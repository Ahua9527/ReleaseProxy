name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与不部署构建
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: 安装固定依赖
        run: bun install --frozen-lockfile

      - name: 代码与格式检查
        run: |
          bun run lint
          bun run typecheck
          bun run format:check

      # Vitest 使用 Node；其余工具通过 bunx --bun 执行。
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 测试
        run: bun run test

      - name: Worker 不部署构建
        run: bun run build
